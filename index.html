<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFD400">
<title>Sharpening Iron — A letter from Mark to Rob</title>
<meta name="description" content="Seven checkpoints. One covenant. A letter from Mark to Rob, set as a broadsheet.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="script" href="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
<link rel="preload" as="script" href="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Offline fallback: if Google Fonts is unreachable, local copies take over. */
@font-face{font-family:'Anton';src:local('Anton'),local('Impact'),local('Arial Narrow');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Space Mono';src:local('Space Mono'),local('Menlo'),local('Consolas');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Space Mono';src:local('Space Mono'),local('Menlo'),local('Consolas');font-weight:700;font-style:normal;font-display:swap}
:root{
  --y:#FFD400; --k:#0A0A0A; --p:#F2EEE3;
  --rule:clamp(5px,.7vw,10px);
  --pad:clamp(16px,3vw,48px);
  --meter:38px;
  --meter-border:4px;
  --meter-label-pad:12px;
  --hd-left:14px;
  --hd-top:14px;
  --s-hd-right:16px;
  --s-hd-top:20px;
  --panel-body-gap:8px;
  --panel-body-bottom:21vh;
  --cap-txt-pad:14px;
  --calm-yl-height:3px;
  --tag-shadow:6px;
  --tag-active-shadow:0 0 0;
  --mast-pad-top:14px;
  --bar-margin:clamp(14px,2vw,28px);
  --focus-outline:4px;
  --focus-offset:3px;
  --chapter-height:340vh;
  --track-width:300vw;
  --nogl-margin:14px;
  --barcode-height:58px;
  --ticker-duration:34s;
  --calm-meta-gap:.9rem;
  --calm-font-size:.8rem;
  --calm-em-size:1.4rem;
  --calm-row-gap:1rem;
  --anton:'Anton',Impact,'Arial Narrow',sans-serif;
  --mono:'Space Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--k);color:var(--p);font-family:var(--mono);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:var(--focus-outline) solid currentColor;outline-offset:var(--focus-offset)}
.t-y{--bg:var(--y);--ink:var(--k)}
.t-k{--bg:var(--k);--ink:var(--y)}

/* One fixed canvas. It only shows through the three transparent hero chapters. */
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;visibility:hidden}
.mast,.run,.calm,.foot,.chapter{position:relative;z-index:1}

/* ───────── Altitude meter ───────── */
.meter{position:fixed;inset:0 0 auto 0;z-index:40;height:var(--meter);display:grid;grid-template-columns:auto 1fr auto;
  background:var(--k);color:var(--y);border-bottom:var(--meter-border) solid var(--y);font:700 12px/1 var(--mono);letter-spacing:.04em}
.meter .lbl,.meter .pct{display:flex;align-items:center;padding:0 var(--meter-label-pad);white-space:nowrap}
.meter .lbl{border-right:var(--meter-border) solid var(--y)}
.meter .pct{border-left:var(--meter-border) solid var(--y);min-width:68px;justify-content:flex-end}
.ticks{position:relative;display:grid;grid-template-columns:repeat(7,1fr);min-width:0}
.tk{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:.6em;border-right:2px solid var(--y);padding:0 2px;color:var(--y)}
.tk:last-child{border-right:0}
.tk span{display:none}
.tk.on b{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}
.tk:hover{background:var(--y);color:var(--k)}
.fill{position:absolute;z-index:2;left:0;top:0;bottom:0;width:0;background:var(--y);mix-blend-mode:difference;pointer-events:none}
@media (min-width:980px){.tk span{display:inline;font-weight:400}}
@media (max-width:560px){.meter .lbl{display:none}.meter{grid-template-columns:1fr auto}}

/* ───────── Shared parts ───────── */
.stamp{display:inline-block;font:400 clamp(1rem,2.6vw,2.6rem)/.95 var(--anton);text-transform:uppercase;letter-spacing:.07em;text-align:center;
  padding:.18em .42em .12em;border:.14em solid var(--ink,var(--k));background:var(--p);color:var(--k);transform:rotate(-8deg);pointer-events:none;z-index:3}
.num{font:400 clamp(5.5rem,16vw,17rem)/.8 var(--anton);color:transparent;-webkit-text-stroke:clamp(2px,.34vw,5px) var(--ink);
  transition:color .12s steps(2,end);user-select:none;cursor:default}
.num:hover{color:var(--ink)}
.quote{align-self:flex-start;max-width:34ch;background:var(--ink);color:var(--bg);font:700 clamp(1.05rem,2vw,1.9rem)/1.2 var(--mono);
  padding:.85em 1.05em;transition:background .12s steps(2,end),color .12s steps(2,end)}
.quote:hover{background:var(--p);color:var(--k)}
.snippet{font-size:clamp(.92rem,1.12vw,1.08rem);line-height:1.6;max-width:50ch}
.tag{align-self:flex-start;display:inline-flex;align-items:center;gap:.6em;background:var(--p);color:var(--k);
  border:clamp(3px,.4vw,5px) solid var(--ink);padding:.55em .9em;font:700 clamp(.9rem,1.35vw,1.2rem)/1 var(--mono);
  box-shadow:var(--tag-shadow) var(--tag-shadow) 0 var(--ink);transition:transform .12s cubic-bezier(.2,.8,.2,1),box-shadow .12s,background .1s,color .1s;white-space:nowrap}
.tag:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--ink);background:var(--ink);color:var(--bg)}
.tag:active{transform:translate(4px,4px);box-shadow:var(--tag-active-shadow)}
.tag i{font-style:normal;font-weight:400;opacity:.6;font-size:.8em}
.emo-cell{display:grid;place-items:center;width:clamp(92px,13vw,210px);background:var(--p);border-left:var(--rule) solid var(--ink);perspective:520px;color:var(--k)}
.emo{display:inline-block;font-size:clamp(3rem,6.6vw,6.8rem);line-height:1;transform-style:preserve-3d;user-select:none}

/* ───────── Masthead (flat) ───────── */
.mast{background:var(--p);color:var(--k);padding:calc(var(--meter) + var(--mast-pad-top)) var(--pad) 0;border-bottom:var(--rule) solid var(--k)}
.title{font:400 clamp(3.2rem,calc((100vw - 2*var(--pad))/4.9),24rem)/.86 var(--anton);text-transform:uppercase;letter-spacing:-.005em}
.title .line{display:block;overflow:hidden;white-space:nowrap;perspective:700px;padding-top:.03em}
.title .l2{display:flex;align-items:stretch;gap:2vw}
.title .word{display:inline-block}
.title .ch{display:inline-block;will-change:transform}
.slot{flex:1;min-height:.7em;align-self:center;height:.62em}
.slot svg{display:block;width:100%;height:100%}
.bar{margin:var(--bar-margin) calc(-1*var(--pad)) 0;background:var(--k);color:var(--y);padding:.9em var(--pad);
  font:700 clamp(.72rem,1.25vw,1rem)/1.25 var(--mono);letter-spacing:.06em}
.stamp-mast{position:absolute;right:var(--pad);top:calc(var(--meter) + var(--s-hd-top));background:var(--y);--ink:var(--k);font-size:clamp(1.1rem,3.4vw,3.4rem);transform:rotate(-7deg)}

/* ───────── 3D hero chapters (01, 05, 07) ───────── */
.chapter{height:var(--chapter-height)}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
.hd{position:absolute;z-index:3;top:calc(var(--meter) + var(--hd-top));left:var(--hd-left);max-width:min(92vw,980px);display:flex;align-items:stretch;
  background:var(--bg);color:var(--ink);border:var(--rule) solid var(--ink)}
.hd .big{padding:.02em .12em 0 .08em;font:400 clamp(3.2rem,8.5vw,8rem)/.85 var(--anton);color:transparent;
  -webkit-text-stroke:clamp(2px,.3vw,4px) var(--ink);border-right:var(--rule) solid var(--ink);user-select:none}
.hd h2{padding:.5rem 1rem;align-self:center;font:400 clamp(1.4rem,3.4vw,3.6rem)/.98 var(--anton);text-transform:uppercase}
.s-hd{position:absolute;right:var(--s-hd-right);top:calc(var(--meter) + var(--s-hd-top));font-size:clamp(1rem,2.6vw,2.6rem)}
.cap{position:absolute;z-index:3;left:0;right:0;bottom:0;display:grid;grid-template-columns:minmax(0,1fr) auto;
  background:var(--bg);color:var(--ink);border-top:var(--rule) solid var(--ink)}
.cap-txt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:clamp(12px,2vw,32px);padding:var(--cap-txt-pad)}
.cap .quote{max-width:26ch}
.flash{position:absolute;inset:0;z-index:2;background:var(--y);opacity:0;pointer-events:none}
@media (max-width:860px){
  .cap-txt{grid-template-columns:1fr;gap:12px;padding:var(--cap-txt-pad)}
  .cap .snippet{font-size:.85rem;line-height:1.45}
  .cap .quote{max-width:none;font-size:1rem}
  .hd .big{font-size:clamp(2.6rem,13vw,4.4rem)}
  .hd h2{font-size:clamp(1.1rem,5vw,1.7rem);padding:.4rem .7rem}
}

/* ───────── Flat run (02–04): one continuous rope-and-type pull ───────── */
.run{height:var(--chapter-height)}
.run-stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
.track{position:relative;display:flex;width:var(--track-width);height:100%;will-change:transform}
.braid{position:absolute;left:0;top:0;z-index:1;pointer-events:none}
.panel{position:relative;flex:0 0 100vw;width:100vw;height:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;
  padding-top:var(--meter);overflow:hidden}
.panel.k{background:var(--k);color:var(--y);--ink:var(--y);--bg:var(--k)}
.panel.y{background:var(--y);color:var(--k);--ink:var(--k);--bg:var(--y)}
.panel+.panel{border-left:var(--rule) solid var(--k)}
.panel>.num,.panel>.body,.panel>.emo-cell{position:relative;z-index:2}
.panel>.num{padding:.02em .1em 0 .06em;border-right:var(--rule) solid var(--ink);display:flex;align-items:flex-start;will-change:transform}
.panel>.body{display:flex;flex-direction:column;gap:var(--panel-body-gap);padding:var(--pad) var(--pad) var(--panel-body-bottom);min-height:0}
.panel>.emo-cell{border-left:var(--rule) solid var(--ink)}
.panel h2{font:400 clamp(1.7rem,min(4.8vw,7.4vh),5rem)/.96 var(--anton);text-transform:uppercase;max-width:18ch}
.art{position:relative;flex:1 1 0;min-height:0;display:grid;align-content:center}
.mirror{font:400 clamp(2.4rem,min(9vw,13vh),9rem)/.9 var(--anton);text-transform:uppercase;white-space:nowrap}
.m-rule{height:var(--rule);background:var(--ink);margin:.06em 0 .1em}
.m-refl{position:relative;height:.9em;transform:scaleY(-1);opacity:.92}
.m-refl span{position:absolute;left:0;top:0}
.flow{display:grid;gap:.04em;font:400 clamp(3rem,min(12vw,16vh),12rem)/.86 var(--anton);text-transform:uppercase;white-space:nowrap}
.flow .f{color:transparent;-webkit-text-stroke:clamp(2px,.3vw,4px) var(--ink);will-change:transform}
.count{font:400 clamp(4rem,min(17vw,26vh),17rem)/.85 var(--anton);letter-spacing:-.01em}
.count-lbl{font:700 clamp(.8rem,1.3vw,1.15rem)/1.3 var(--mono);letter-spacing:.04em;margin-top:.6em}
.stamp4{position:absolute;right:2%;top:8%;background:var(--p);color:var(--k);--ink:var(--y);opacity:0;will-change:transform}
@media (max-width:760px){
  .panel{grid-template-columns:1fr auto;grid-template-rows:auto minmax(0,1fr)}
  .panel>.num{font-size:clamp(4rem,22vw,7rem);border-right:0}
  .panel>.emo-cell{width:clamp(84px,26vw,130px)}
  .panel>.body{grid-column:1 / -1;border-top:var(--rule) solid var(--ink);padding-bottom:19vh}
  .panel .snippet{font-size:.85rem;line-height:1.45}
}

/* ───────── 06 · silent and static: no motion, nothing animates ───────── */
.calm{min-height:100vh;min-height:100svh;background:var(--p);color:var(--k);overflow:hidden;
  padding:calc(var(--meter) + 5vh) var(--pad) var(--pad);display:block}
.calm *{transition:none!important;animation:none!important}
.calm .meta{position:relative;z-index:2;display:grid;gap:var(--calm-meta-gap);max-width:42ch;font-size:var(--calm-font-size);line-height:1.55}
.calm .meta h2{font:700 .85rem/1.3 var(--mono);letter-spacing:.02em}
.calm .meta .n{font:400 1.4rem/1 var(--anton)}
.calm .quote-s{font-weight:700}
.calm .tag{box-shadow:none;font-size:.8rem;padding:.5em .8em;border-width:3px}
.calm .tag:hover,.calm .tag:active{transform:none;box-shadow:none;background:var(--p);color:var(--k)}
.calm .em{font-size:var(--calm-em-size);line-height:1}
.calm .yl{position:absolute;left:0;right:0;top:66%;height:var(--calm-yl-height);background:var(--y)}
.calm .compass{position:absolute;right:clamp(24px,12vw,220px);top:66%;width:clamp(150px,22vw,300px);transform:translateY(-50%)}
.calm .meta-row{display:flex;align-items:center;gap:var(--calm-row-gap)}
@media (max-width:760px){.calm .compass{right:20px;top:72%}.calm .yl{top:72%}}

/* ───────── Footer ───────── */
.foot{background:var(--p);color:var(--k);border-top:var(--rule) solid var(--k);padding:clamp(24px,4vw,64px) var(--pad) 0}
.foot h2{font:400 clamp(2.2rem,6.6vw,7.4rem)/.94 var(--anton);text-transform:uppercase;max-width:15ch}
.foot-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px;margin:clamp(20px,3vw,44px) 0 clamp(20px,3vw,40px)}
#barcode{width:min(260px,60vw);height:var(--barcode-height);display:block}
.sig{font:400 clamp(1.6rem,3vw,2.6rem)/1 var(--anton);text-transform:uppercase;letter-spacing:.03em}
.top{background:var(--k);color:var(--y);padding:.9em 1.2em;font:700 .9rem/1 var(--mono);letter-spacing:.05em;border:4px solid var(--k);transition:background .1s,color .1s}
.top:hover{background:var(--y);color:var(--k)}
.ticker{margin:0 calc(-1*var(--pad));background:var(--k);color:var(--y);overflow:hidden;border-top:var(--rule) solid var(--k)}
.tick{display:flex;width:max-content;animation:tick var(--ticker-duration) linear infinite;padding:.5em 0}
.tick span{font:400 clamp(1.3rem,2.6vw,2.4rem)/1 var(--anton);letter-spacing:.06em;text-transform:uppercase;padding:0 1.1em;white-space:nowrap}
.tick i{font-style:normal;align-self:center;font-size:.9rem}
@keyframes tick{to{transform:translateX(-50%)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
#loader{animation:pulse 1.2s ease-in-out infinite}
html.reduce #loader{animation:none;opacity:1}
.toast{position:fixed;left:50%;bottom:16px;z-index:60;transform:translate(-50%,160%);background:var(--k);color:var(--y);border:4px solid var(--y);
  padding:.8em 1.1em;font:700 .95rem/1 var(--mono);letter-spacing:.05em;transition:transform .18s cubic-bezier(.2,.9,.2,1);pointer-events:none;max-width:92vw}
.toast.on{transform:translate(-50%,0)}

/* ───────── Reduced motion: no scrub, no horizontal pull. Scenes render in their resolved state. ───────── */
html.reduce .chapter{height:100vh;height:100svh}
html.reduce .run{height:auto}
html.reduce .run-stage{position:relative;height:auto;overflow:visible}
html.reduce .track{display:block;width:auto;transform:none!important}
html.reduce .panel{width:100%;height:auto;min-height:100vh;min-height:100svh}
html.reduce .panel+.panel{border-left:0;border-top:var(--rule) solid var(--k)}
html.reduce .panel>.body{padding-bottom:var(--pad)}
html.reduce .braid{display:none}
html.reduce .tick{animation:none}
html.reduce .toast,html.reduce .tag,html.reduce .num,html.reduce .quote{transition:none}

/* ───────── No WebGL: chapters fall back to flat colour modules ───────── */
html.nogl .chapter{height:auto}
html.nogl .stage{position:relative;height:auto;min-height:100vh;overflow:visible;padding-top:var(--meter)}
html.nogl .c1 .stage{background:var(--p)}
html.nogl .c5 .stage{background:var(--y)}
html.nogl .c7 .stage{background:var(--k)}
html.nogl .hd,html.nogl .cap{position:relative;top:auto;left:auto;margin:var(--nogl-margin)}
html.nogl .flash{display:none}
.skip{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden}
.skip:focus{position:fixed;left:16px;top:16px;width:auto;height:auto;padding:8px 12px;background:var(--k);color:var(--y);border:4px solid var(--y);z-index:9999;font:700 14px/1 var(--mono)}
</style>
</head>
<body>
<a class="skip" href="#run">Skip to checkpoints</a>
<div id="loader" style="position:fixed;inset:0;z-index:9999;background:var(--k);color:var(--y);display:flex;align-items:center;justify-content:center;font:700 14px/1 var(--mono);letter-spacing:.06em">LOADING…</div>
<canvas id="gl" aria-hidden="true"></canvas>

<nav class="meter" aria-label="Checkpoints">
  <div class="lbl">CHECKPOINT <b id="cp">&nbsp;00</b>/07</div>
  <div class="ticks" id="ticks"></div>
  <div class="pct" id="pct">00%</div>
</nav>

<main>
  <noscript>
    <style>
      .chapter,.run,.calm{height:auto!important;min-height:100vh}
      .stage,.run-stage{position:relative!important;height:auto!important;overflow:visible!important}
      .track{display:block!important;width:auto!important;transform:none!important}
      .panel{width:100%!important;height:auto!important;min-height:100vh}
      #gl{display:none!important}
      #loader{display:none!important}
      .meter{position:relative!important;height:auto!important;border-bottom:2px solid var(--y);padding:8px 0}
      .ticks{display:block!important}
      .tk{border-right:1px solid var(--y);padding:4px 8px;display:inline-block}
      .tk span{display:inline!important}
    </style>
  
  <!-- Masthead: flat -->
  <header class="mast" id="top">
    <h1 class="title" aria-label="Sharpening Iron">
      <span class="line" data-split>SHARPENING</span>
      <span class="line l2"><span class="word" data-split>IRON</span><span class="slot" id="slot" aria-hidden="true"><svg id="slotsvg"></svg></span></span>
    </h1>
    <div class="bar">A LETTER FROM MARK TO ROB — VOL. 1 — NO. 7 CHECKPOINTS</div>
    <div class="stamp stamp-mast" aria-hidden="true">EXCLUSIVE</div>
  </header>

  <!-- 01 · HERO 3D · The Quiet Summit -->
  <section class="chapter c1" id="p1" data-short="HORIZON" data-scene="summit">
    <div class="stage">
      <div class="hd t-k"><div class="big" aria-hidden="true">01</div><h2>The Shared Horizon</h2></div>
      <div class="stamp s-hd t-y" aria-hidden="true" style="transform:rotate(-8deg)">CHECKPOINT</div>
      <div class="cap t-y">
        <div class="cap-txt">
          <p class="quote">“Different terrain, same mountain.”</p>
          <p class="snippet">We’re both becoming the kind of people who make others feel safe enough to grow.</p>
          <button class="tag" type="button" data-tag="#SameMountain" aria-label="Copy hashtag SameMountain">#SameMountain <i>COPY</i></button>
        </div>
        <div class="emo-cell"><span class="emo" role="img" aria-label="Mountain">🏔️</span></div>
      </div>
    </div>
  </section>

  <!-- 02–04 · FLAT · one continuous rope-and-type pull -->
  <section class="run" id="run" aria-label="Checkpoints two to four">
    <div class="run-stage">
      <div class="track" id="track">
        <svg class="braid" id="braid" aria-hidden="true"></svg>

        <article class="panel k" id="p2" data-short="MIRROR">
          <div class="num" aria-hidden="true">02</div>
          <div class="body">
            <h2>The Mirror, Not the Magnifying Glass</h2>
            <div class="art" aria-hidden="true">
              <div class="mirror">
                <div class="m-top">Not a gap.</div>
                <div class="m-rule"></div>
                <div class="m-refl"><span id="ma">Not a gap.</span><span id="mb">A compass.</span></div>
              </div>
            </div>
            <p class="quote">“Not a gap. A compass.”</p>
            <p class="snippet">I didn’t see someone who needs fixing. I saw someone operating at a frequency most people never find.</p>
            <button class="tag" type="button" data-tag="#CalibrateHere" aria-label="Copy hashtag CalibrateHere">#CalibrateHere <i>COPY</i></button>
          </div>
          <div class="emo-cell"><span class="emo" role="img" aria-label="Mirror">🪞</span></div>
        </article>

        <article class="panel y" id="p3" data-short="EXCHANGE">
          <div class="num" aria-hidden="true">03</div>
          <div class="body">
            <h2>The Exchange of Value</h2>
            <div class="art" aria-hidden="true">
              <div class="flow"><div class="f f1" id="f1">Give →</div><div class="f f2" id="f2">← Take</div></div>
            </div>
            <p class="quote">“Resource flowing both ways.”</p>
            <p class="snippet">You called it “just being a good person.” I call it leadership. Now I want to put actual weight on your rope.</p>
            <button class="tag" type="button" data-tag="#WeightOnTheRope" aria-label="Copy hashtag WeightOnTheRope">#WeightOnTheRope <i>COPY</i></button>
          </div>
          <div class="emo-cell"><span class="emo" role="img" aria-label="Handshake">🤝</span></div>
        </article>

<script>
(function(){
'use strict';
/*==HELPERS==*/
const PAP=0xF2EEE3, YEL=0xFFD400, BLK=0x0A0A0A;
const FONT='Anton, Impact, "Arial Narrow", sans-serif';
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t);};
const eOut=t=>1-Math.pow(1-t,3);

/*==SCENES==*/
/* Sample type from a 2D canvas into a grid of voxels (brutalist pixel letters). */
function voxelText(lines,o){

    const fs=o.justify?100*(o.cols*step)/w100:o.fs;

    const c=document.createElement('canvas'); c.width=wpx+2; c.height=hpx;
    const g=c.getContext('2d'); g.font='400 '+fs+'px '+FONT; g.fillStyle='#000'; g.textBaseline='alphabetic'; g.fillText(text,0,fs*.98);
    const data=g.getImageData(0,0,c.width,c.height).data;
    const words=text.split(' '), ends=[]; let acc='';
    words.forEach(function(wd){acc=acc?acc+' '+wd:wd; ends.push(g.measureText(acc).width);});
    const rows=Math.ceil(hpx/step), cells=[]; let r0=1e9, r1=-1;
    for(let r=0;r<rows;r++) for(let ci=0;ci<cols;ci++){

      if(data[(py*c.width+px)*4+3]>110){

  const maxCols=Math.max.apply(null,meta.map(function(m){return m.cols;}));
  const pts=[]; let cur=0;
  meta.forEach(function(m,i){
    if(i) cur+=gap;
    m.cells.forEach(function(k){
      pts.push({x:(k.ci-m.cols/2+.5)*o.cell, y:((total/2)-(cur+(k.r-m.r0))-.5)*o.cell, line:m.li, w:lines.length>1?m.li:k.wi});

/* Voxel = front face in `front`, extruded sides in `side`, so angled views read as printed block type. */
function voxelMesh(count,cell,depth,front,side){

  const col=new Float32Array(24*3), f=new THREE.Color(front), s=new THREE.Color(side);

}
function textTexture(lines,color){

  const g=c.getContext('2d'); g.fillStyle=color; g.textAlign='center'; g.textBaseline='middle';
  lines.forEach(function(t,i){
    let fs=380; g.font='400 '+fs+'px '+FONT;
    const w=g.measureText(t).width; if(w>W-60){fs=fs*(W-60)/w; g.font='400 '+fs+'px '+FONT;}

/* ═════ 01 · THE QUIET SUMMIT — layered paper-cut ridges, fog, a yellow sunrise line ═════ */
/* Fixed-seed PRNG ensures the summit ridges, camera path, and text placement are identical on every load. */
function makeSummit(){
  const RIDGES=7, RIDGE_BASE_W=70, RIDGE_W_STEP=16, RIDGE_Z_START=-4, RIDGE_Z_STEP=-7.5, RIDGE_Y_BASE=.9, RIDGE_Y_STEP=1.15;
  const SUN_RADIUS=10, SUN_Y=-3, SUN_Z=-70, LINE_W=400, LINE_Y=7, LINE_Z=-69.5, FOG_NEAR=8, FOG_FAR=64;
  const CAM_FOV=45, CAM_Z_NEAR=.1, CAM_Z_FAR=300, CAM_START_Z=9, CAM_END_Z=-40, CAM_START_Y=2.2, CAM_END_Y=9.5;
  const TEXT_W_PORTRAIT=34, TEXT_W_LANDSCAPE=58, TEXT_Z=-19, TEXT_Y=9, VIEW_OFFSET_Y_RATIO=.06;
  const scene=new THREE.Scene(); scene.background=new THREE.Color(PAP); scene.fog=new THREE.Fog(PAP,FOG_NEAR,FOG_FAR);
  const cam=new THREE.PerspectiveCamera(CAM_FOV,1,CAM_Z_NEAR,CAM_Z_FAR);
  const r=rng(11);

    }
    sh.lineTo(W/2,-18); sh.closePath();
    const m=new THREE.Mesh(new THREE.ShapeGeometry(sh),new THREE.MeshBasicMaterial({color:BLK}));

  }

  sun.position.set(0,SUN_Y,SUN_Z); scene.add(sun);
  const lg=new THREE.PlaneGeometry(LINE_W,.5); lg.translate(200,0,0);
  const line=new THREE.Mesh(lg,new THREE.MeshBasicMaterial({color:YEL,fog:false}));
  line.position.set(-200,LINE_Y,LINE_Z); line.scale.x=.0001; scene.add(line);
  let tex1=null, tex2=null;
  const tm=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({transparent:true,depthWrite:false}));

    tm.material.map=tx; tm.material.needsUpdate=true;

    scene:scene, cam:cam,
    resize:function(w,h){

}

/* ═════ 05 · PAPER CLIMBERS — a headline cliff, two faceless figures, one rope, a role swap ═════ */
/* Fixed-seed PRNG makes the climber path, rope sway, and figure jitter reproducible on every load. */
function makeClimb(){
  const VOXEL_CELL=.17, VOXEL_DEPTH=.5, FIGURE_SCALE=.9, ROPE_SEGMENTS=30;
  const CAM_FOV=40, CAM_Z_NEAR=.1, CAM_Z_FAR=300, VIEW_OFFSET_Y_RATIO=.08;
  const GROUND_Y_OFFSET=-.6, GROUND_Z=1.5, ROPE_Y_OFFSET=.62, ROPE_Z=.62;
  const LIMB_ARM_W=.16, LIMB_ARM_H=.62, LIMB_ARM_X=.37, LIMB_ARM_Y=.35;
  const LIMB_LEG_W=.2, LIMB_LEG_H=.7, LIMB_LEG_X=.15, LIMB_LEG_Y=-.4;
  const BODY_W=.55, BODY_H=.8, BODY_D=.28, BELT_W=.58, BELT_H=.14, BELT_D=.3, HEAD_R=.26;
  const PATH_POINTS=[[-.42,0],[-.34,.2],[-.12,.38],[.06,.55],[.2,.8],[.36,1]];
  const EASE_CLIMB_A=.48, EASE_CLIMB_B=.52, EASE_CLIMB_B_SCALE=.9;
  const POSE_CLIMB_ARM=-2.7, POSE_CLIMB_ARM_PH=.35, POSE_CLIMB_LEG=-.15, POSE_CLIMB_LEG_PH=.4;
  const POSE_BELAY_ARM=-2.2, POSE_BELAY_LEG=-.14;
  const POSE_CHEER_ARM=-2.9, POSE_CHEER_ARM_PH=.25, POSE_CHEER_LEG=-.1;
  const ROPE_SAG_CLAMP=4, ROPE_SAG_SCALE=.25, ROPE_SAG_Y=.35, ROPE_SCALE_XY=1.15;
  const CAM_CENTER_Z=.3, CAM_TARGET_Y=1.4, CAM_TARGET_Z_OFFSET=.8;
  const DIST_INIT=30;
  const scene=new THREE.Scene(); scene.background=new THREE.Color(YEL);
  const cam=new THREE.PerspectiveCamera(CAM_FOV,1,CAM_Z_NEAR,CAM_Z_FAR);
  const cell=VOXEL_CELL, depth=VOXEL_DEPTH;
  const vt=voxelText(['HOLD','THE LINE'],{step:8,justify:true,cols:96,cell:cell,gap:3});
  const wall=voxelMesh(vt.pts.length,cell,depth,BLK,PAP), dummy=new THREE.Object3D();
  vt.pts.forEach(function(q,i){dummy.position.set(q.x,q.y,0); dummy.scale.set(1,1,1); dummy.updateMatrix(); wall.setMatrixAt(i,dummy.matrix);});
  wall.instanceMatrix.needsUpdate=true; scene.add(wall);
  const WW=vt.width, HH=vt.height, y0=-HH/2, y1=HH/2;
  const ground=new THREE.Mesh(new THREE.BoxGeometry(WW+14,1.2,5),new THREE.MeshBasicMaterial({color:BLK}));
  ground.position.set(0,y0+GROUND_Y_OFFSET,GROUND_Z);
  ground.add(new THREE.LineSegments(new THREE.EdgesGeometry(ground.geometry),new THREE.LineBasicMaterial({color:PAP})));
  scene.add(ground);

  const S=FIGURE_SCALE, edgeMat=new THREE.LineBasicMaterial({color:BLK});
  const paperM=new THREE.MeshBasicMaterial({color:PAP}), blkM=new THREE.MeshBasicMaterial({color:BLK});
  function part(geo,mat,x,y,z){const m=new THREE.Mesh(geo,mat); m.position.set(x,y,z); m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo),edgeMat)); return m;}
  function limb(w,h,x,y){const piv=new THREE.Group(); piv.position.set(x,y,0); piv.add(part(new THREE.BoxGeometry(w,h,w),paperM,0,-h/2,0)); return piv;}
  function figure(){
    const g=new THREE.Group();
    const armL=limb(LIMB_ARM_W,LIMB_ARM_H,-LIMB_ARM_X,LIMB_ARM_Y), armR=limb(LIMB_ARM_W,LIMB_ARM_H,LIMB_ARM_X,LIMB_ARM_Y);
    const legL=limb(LIMB_LEG_W,LIMB_LEG_H,-LIMB_LEG_X,LIMB_LEG_Y), legR=limb(LIMB_LEG_W,LIMB_LEG_H,LIMB_LEG_X,LIMB_LEG_Y);

  function quad(t,out){const k=1-t; out.set(k*k*ra.x+2*k*t*rm.x+t*t*rb.x, k*k*ra.y+2*k*t*rm.y+t*t*rb.y, k*k*ra.z+2*k*t*rm.z+t*t*rb.z); return out;}

  const center=new THREE.Vector3(0,0,CAM_CENTER_Z), tgt=new THREE.Vector3(), pA=new THREE.Vector3(), pB=new THREE.Vector3(), hA=new THREE.Vector3(), hB=new THREE.Vector3();
  let dist=DIST_INIT;
  return {
    scene:scene, cam:cam,
    resize:function(w,h){

      dist=Math.max(((WW+7)/2)/(tn*asp),((HH+7)/2)/tn);

      pose(B,done?'cheer':(p>.52?'climb':'belay'),done?t*3+1:uBraw*60);
      hA.set(A.position.x,A.position.y-.3*S,A.position.z+.2); hB.set(B.position.x,B.position.y-.3*S,B.position.z+.2);
      updateRope(hA,hB);
      const act=p<.5?A.position:B.position;
      tgt.copy(center).lerp(act,.45);
      const th=lerp(-.5,.55,p);
      cam.position.set(tgt.x+Math.sin(th)*dist,tgt.y+1.4+p*.8,tgt.z+Math.cos(th)*dist);
      cam.lookAt(tgt);
    }
  };
}

/* ═════ 07 · THE FORGE — two bars heat and strike three times; each hit lands a word ═════ */
/* Fixed-seed PRNG keeps spark behaviour and word jitter deterministic across reloads. */
function makeForge(portrait){
  const VOXEL_CELL_PORTRAIT=.19, VOXEL_CELL_LANDSCAPE=.17, VOXEL_DEPTH=.6;
  const BAR_W=5, BAR_H=.72, BAR_D=.72, BAR_COLOR=0x1c1c1c;
  const SPARK_COUNT=90, SPARK_W=.16, SPARK_H=.16, SPARK_D=.03;
  const SPARK_V_MIN=4, SPARK_V_MAX=12, SPARK_S_MIN=.5, SPARK_S_MAX=1.2;
  const RING_INNER=.9, RING_OUTER=1, RING_Z=.8;
  const STRIKE_TIMES=[.46,.66,.84];
  const WORD_TARGET_Y=-3, WORD_START_Z=.6, WORD_EARLY_SCALE=.35, WORD_LATE_SCALE=1;
  const CAM_FOV=40, CAM_Z_NEAR=.1, CAM_Z_FAR=300, DIST_INIT=30;
  const scene=new THREE.Scene(); scene.background=new THREE.Color(BLK);
  const cam=new THREE.PerspectiveCamera(CAM_FOV,1,CAM_Z_NEAR,CAM_Z_FAR);
  const cell=portrait?VOXEL_CELL_PORTRAIT:VOXEL_CELL_LANDSCAPE, depth=VOXEL_DEPTH;
  const vt=portrait?voxelText(['IRON','ON','IRON'],{step:8,justify:false,fs:230,cell:cell,gap:3})
                   :voxelText(['IRON ON IRON'],{step:8,justify:true,cols:150,cell:cell,gap:3});
  const words=voxelMesh(vt.pts.length,cell,depth,YEL,PAP); scene.add(words);
  const r=rng(5), V=vt.pts.map(function(q){return {tx:q.x,ty:q.y,sx:(r()-.5)*1.2,sy:(r()-.5)*1.2,sz:.5+r()*1.2,w:Math.min(2,q.w),a:(r()-.5)*5};});
  function bar(){
    const m=new THREE.Mesh(new THREE.BoxGeometry(BAR_W,BAR_H,BAR_D),new THREE.MeshBasicMaterial({color:BAR_COLOR}));
    m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),new THREE.LineBasicMaterial({color:PAP})));
    scene.add(m); return m;
  }
  const L=bar(), R=bar(), cold=new THREE.Color(BAR_COLOR), hot=new THREE.Color(YEL);
  const NS=SPARK_COUNT, sparks=new THREE.InstancedMesh(new THREE.BoxGeometry(SPARK_W,SPARK_H,SPARK_D),new THREE.MeshBasicMaterial({color:0xffffff}),NS*3);
  const sr=rng(9), SP=[];
  for(let i=0;i<NS*3;i++){ SP.push({a:sr()*Math.PI*2,v:SPARK_V_MIN+sr()*(SPARK_V_MAX-SPARK_V_MIN),s:SPARK_S_MIN+sr()*(SPARK_S_MAX-SPARK_S_MIN),z:(sr()-.5),k:Math.floor(i/NS),r:sr()*6}); sparks.setColorAt(i,new THREE.Color(sr()>.4?YEL:PAP)); }
  sparks.instanceColor.needsUpdate=true; sparks.frustumCulled=false; scene.add(sparks);
  const rings=STRIKE_TIMES.map(function(s,i){
    const m=new THREE.Mesh(new THREE.RingGeometry(RING_INNER,RING_OUTER,64),new THREE.MeshBasicMaterial({color:i%2?PAP:YEL,transparent:true,side:THREE.DoubleSide}));
    m.position.set(0,0,RING_Z); m.visible=false; scene.add(m); return m;
  });
  const d=new THREE.Object3D(), tcol=new THREE.Color();
  let dist=DIST_INIT, prev=0, kick=0;
  const api={scene:scene,cam:cam,flash:0,
    resize:function(w,h){
      const asp=w/h, tn=Math.tan(20*Math.PI/180);
      dist=Math.max(((vt.width+(portrait?3:5))/2)/(tn*asp),((vt.height+4)/2)/tn);
      cam.aspect=asp; cam.setViewOffset(w,h,0,Math.round(h*.06),w,h); cam.updateProjectionMatrix();
    },
    update:function(p,t,dt){
      dt=dt||.016;
      STRIKE_TIMES.forEach(function(s){ if((prev<s&&p>=s)||(prev>=s&&p<s)) kick=1; });
      prev=p; kick*=Math.exp(-dt*5); api.flash=kick;
      let dd=1; STRIKE_TIMES.forEach(function(s){dd=Math.min(dd,Math.abs(p-s)/.09);});
      const gap=Math.pow(clamp(dd),1.4)*3.2, away=sstep(.9,1,p);
      tcol.lerpColors(cold,hot,sstep(.1,.5,p)); L.material.color.copy(tcol); R.material.color.copy(tcol);
      L.position.set(-(2.5+gap/2)-away*8,-away*7,0); R.position.set(2.5+gap/2+away*8,-away*7,0);
      L.rotation.z=.14*(gap/3.2); R.rotation.z=-.14*(gap/3.2);
      for(let i=0;i<V.length;i++){
        const v=V[i], e=eOut(clamp((p-STRIKE_TIMES[v.w])/.08));
        if(e<=0){d.scale.set(0,0,0);}
        else{
          d.position.set(lerp(v.sx,v.tx,e),lerp(v.sy,v.ty,e)+(1-e)*v.a,lerp(WORD_START_Z,WORD_TARGET_Y,e)+(1-e)*v.sz);
          d.scale.setScalar(lerp(WORD_EARLY_SCALE,WORD_LATE_SCALE,e));
        }
        d.updateMatrix(); words.setMatrixAt(i,d.matrix);
      }
      words.instanceMatrix.needsUpdate=true;
      d.scale.set(1,1,1);
      for(let i=0;i<SP.length;i++){
        const sp=SP[i], tau=(p-STR[sp.k])*9;
        if(tau<=0||tau>1.4){d.scale.set(0,0,0); d.position.set(0,0,0);}
        else{
          d.position.set(Math.cos(sp.a)*sp.v*tau,Math.sin(sp.a)*sp.v*tau-4.5*tau*tau,.8+sp.z*sp.v*tau*.3);
          d.rotation.set(0,0,sp.r*tau); d.scale.setScalar(sp.s*(1-tau/1.4)*(portrait?1.2:1));
        }
        d.updateMatrix(); sparks.setMatrixAt(i,d.matrix);
      }
      d.rotation.set(0,0,0);
      sparks.instanceMatrix.needsUpdate=true;
      rings.forEach(function(m,i){
        const tau=(p-STR[i])/.12;
        if(tau<0||tau>1){m.visible=false;} else {m.visible=true; m.scale.setScalar(1+tau*(portrait?14:22)); m.material.opacity=1-tau;}
      });
      const zf=lerp(1.08,.8,sstep(0,.85,p))+.28*sstep(.88,1,p);
      const sh=kick*.55;
      cam.position.set((Math.sin(t*61)+Math.sin(t*37+1))*.5*sh,(Math.cos(t*53)+Math.sin(t*29))*.5*sh,dist*zf);
      cam.lookAt(0,0,0);
    }
  };
  return api;
}
/*==/SCENES==*/

/* ───────────────── Page code ───────────────── */
const $ =function(s,r){return (r||document).querySelector(s);};
const $$=function(s,r){return Array.from((r||document).querySelectorAll(s));};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const fine=matchMedia('(hover: hover) and (pointer: fine)').matches;
const hasGsap=!!window.gsap;
if(!window.THREE) console.warn('Sharpening Iron: Three.js failed to load. 3D scenes disabled.');
if(!hasGsap) console.warn('Sharpening Iron: GSAP failed to load. Intro and microinteractions disabled.');
if(reduce) document.documentElement.classList.add('reduce');

/* 1 · Split the masthead into letters */
$$('[data-split]').forEach(function(el){
  const t=el.textContent.trim(); el.textContent='';
  Array.from(t).forEach(function(c){const s=document.createElement('span'); s.className='ch'; s.setAttribute('aria-hidden','true'); s.textContent=c; el.appendChild(s);});
});

/* 2 · Elements */
const c1=$('#p1'), c5=$('#p5'), c6=$('#p6'), c7=$('#p7'), run=$('#run'), track=$('#track'), braid=$('#braid');
const panels=$$('.panel'), nums=panels.map(function(p){return $('.num',p);});
const items=[{el:c1},{panel:0},{panel:1},{panel:2},{el:c5},{el:c6},{el:c7}];
const shorts=[c1,panels[0],panels[1],panels[2],c5,c6,c7].map(function(e){return e.dataset.short;});
const chapters=[{el:c1,key:'summit',ps:0},{el:c5,key:'climb',ps:0},{el:c7,key:'forge',ps:0}];
chapters.forEach(function(c){c.hd=$('.hd',c.el); c.cap=$('.cap',c.el); c.rh=-1; c.rc=-1;});
let vw=innerWidth, vh=innerHeight, glx=null, runPs=0;

/* 3 · Meter */
const ticks=$('#ticks');
shorts.forEach(function(s,i){
  const b=document.createElement('button'); b.type='button'; b.className='tk';
  b.setAttribute('aria-label','Go to checkpoint '+(i+1)+': '+s);
  b.innerHTML='<b>'+String(i+1).padStart(2,'0')+'</b><span>'+s+'</span>';
  b.addEventListener('click',function(){goto(i);});
  ticks.appendChild(b);
});
const fill=document.createElement('i'); fill.className='fill'; ticks.appendChild(fill);
const tks=$$('.tk'), cpEl=$('#cp'), pctEl=$('#pct');
function goto(i){
  const it=items[i], beh=reduce?'auto':'smooth';
  if(it.el){it.el.scrollIntoView({behavior:beh,block:'start'});}
  else if(reduce){panels[it.panel].scrollIntoView({behavior:beh,block:'start'});}
  else{
    const top=run.getBoundingClientRect().top+scrollY;
    scrollTo({top:top+(it.panel/2)*(run.offsetHeight-innerHeight),behavior:beh});
  }
}
let active=-2, meterTimer=0;
function updateMeter(){
  const now=performance.now();
  if(now-meterTimer<100) return; // throttle to ~10fps
  meterTimer=now;
  const mid=innerHeight*.5, max=Math.max(1,document.documentElement.scrollHeight-innerHeight);
  const p=clamp(scrollY/max);
  fill.style.width=(p*100).toFixed(2)+'%';
  pctEl.textContent=String(Math.round(p*100)).padStart(2,'0')+'%';
  let a=-1;
  if(c1.getBoundingClientRect().top<mid) a=0;
  if(reduce){panels.forEach(function(pn,i){if(pn.getBoundingClientRect().top<mid) a=1+i;});}
  else if(run.getBoundingClientRect().top<mid) a=1+Math.min(2,Math.round(clamp(runPs)*2));
  if(c5.getBoundingClientRect().top<mid) a=4;
  if(c6.getBoundingClientRect().top<mid) a=5;
  if(c7.getBoundingClientRect().top<mid) a=6;
  if(a!==active){
    active=a;
    tks.forEach(function(b,k){b.classList.toggle('on',k===a); if(k===a) b.setAttribute('aria-current','true'); else b.removeAttribute('aria-current');});
    cpEl.textContent=String(a+1).padStart(2,'0');
  }
}

/* 4 · The braided rope (flat SVG): two strands, striped, tightening to a knot */
function sstepAbs(a,b,x){return sstep(a,b,x);}
function buildBraid(svg,w,h,o){
  svg.setAttribute('viewBox','0 0 '+w+' '+h); svg.setAttribute('width',w); svg.setAttribute('height',h);
  const p1=[], p2=[];
  for(let x=0;x<=w;x+=10){
    let a=o.amp;
    if(o.knotX!=null) a=o.amp*(.16+.84*sstepAbs(0,1,Math.abs(x-o.knotX)/o.knotW));
    const ph=x/o.lam*Math.PI*2;
    p1.push(x.toFixed(1)+','+(o.yc+a*Math.sin(ph)).toFixed(1));
    p2.push(x.toFixed(1)+','+(o.yc-a*Math.sin(ph)).toFixed(1));
  }
  const d1='M'+p1.join('L'), d2='M'+p2.join('L'), sw=o.sw;
  svg.innerHTML=
    '<path d="'+d1+'" fill="none" stroke="#0A0A0A" stroke-width="'+sw+'"/>'+
    '<path class="dash" data-o="0" d="'+d1+'" fill="none" stroke="#FFD400" stroke-width="'+sw+'" stroke-dasharray="'+sw+' '+sw+'"/>'+
    '<path d="'+d2+'" fill="none" stroke="#0A0A0A" stroke-width="'+sw+'"/>'+
    '<path class="dash" data-o="'+(sw/2)+'" d="'+d2+'" fill="none" stroke="#F2EEE3" stroke-width="'+sw+'" stroke-dasharray="'+sw+' '+sw+'" stroke-dashoffset="'+(sw/2)+'"/>';
}
let dashEls=[];
let braidCache={vw:0,vh:0,slotW:0,slotH:0};
function buildRopes(){
  const sw=clamp(vh*.022,10,20);
  if(braidCache.vw!==vw||braidCache.vh!==vh){
    buildBraid(braid,vw*3,vh,{yc:vh*.9,amp:vh*.04,lam:clamp(vw*.2,140,360),knotX:vw*1.5,knotW:vw*.6,sw:sw});
    braid.style.width=(vw*3)+'px'; braid.style.height=vh+'px';
    braidCache.vw=vw; braidCache.vh=vh;
    dashEls=$$('.dash',braid);
  }
  const slot=$('#slot'), r=slot.getBoundingClientRect();
  if(r.width>20&&r.height>10&&(braidCache.slotW!==r.width||braidCache.slotH!==r.height)){
    const s2=clamp(r.height*.14,8,22);
    buildBraid($('#slotsvg'),Math.round(r.width),Math.round(r.height),{yc:r.height/2,amp:r.height*.3,lam:r.height*1.7,sw:s2});
    braidCache.slotW=r.width; braidCache.slotH=r.height;
  }
}

/* 5 · Flat-run effects: mirror resolves, words pass each other, compounding counts up */
const elMA=$('#ma'), elMB=$('#mb'), elF1=$('#f1'), elF2=$('#f2'), elCount=$('#count'), elStamp=$('#stamp4');
function panelFx(i,off){
  nums[i].style.transform='translate3d('+(-off*vw*.12).toFixed(1)+'px,0,0)';
  if(i===0){
    const x=clamp(1-Math.abs(off)*3.2)*100;
    elMB.style.clipPath='inset(0 '+(100-x).toFixed(1)+'% 0 0)';
    elMA.style.clipPath='inset(0 0 0 '+x.toFixed(1)+'%)';
  }else if(i===1){
    elF1.style.transform='translate3d('+(off*vw*.5).toFixed(1)+'px,0,0)';
    elF2.style.transform='translate3d('+(-off*vw*.5).toFixed(1)+'px,0,0)';
  }else{
    const r=sstep(-.7,-.05,off);
    elCount.textContent=(1+(37.78-1)*r).toFixed(1)+'×';
    const s=clamp((off+.12)/.1);
    elStamp.style.opacity=s>.02?'1':'0';
    elStamp.style.transform='rotate(-7deg) scale('+lerp(2.8,1,s*s*s).toFixed(3)+')';
  }
}

/* 6 · Main loop */
function setClip(el,r){el.style.clipPath='inset(0 '+((1-r)*100).toFixed(1)+'% 0 0)';}
let tPrev=0;
function frame(now){
  const t=now/1000, dt=reduce?.016:clamp(t-tPrev,.001,.1); tPrev=t;
  if(dt>.1) return; // frame-budget bail: skip if the browser was busy
  let act=null;
  chapters.forEach(function(c){
    const r=c.el.getBoundingClientRect(), span=r.height-vh;
    const raw=reduce?1:(span>0?clamp(-r.top/span):1);
    c.ps=reduce?raw:c.ps+(raw-c.ps)*(1-Math.exp(-dt*7));
    if(r.top<vh&&r.bottom>0&&!act) act=c;
    const rh=(reduce||!glx)?1:sstep(0,.08,c.ps), rc=(reduce||!glx)?1:sstep(.04,.14,c.ps);
    if(Math.abs(rh-c.rh)>.002){c.rh=rh; setClip(c.hd,rh);}
    if(Math.abs(rc-c.rc)>.002){c.rc=rc; setClip(c.cap,rc);}
  });
  if(glx){
    if(act){
      const sc=glx.scenes[act.key];
      glx.canvas.style.visibility='visible';
      try{ sc.update(act.ps,t,dt); }catch(e){ console.warn('Sharpening Iron: scene update failed for',act.key,e); }
      glx.renderer.render(sc.scene,sc.cam);
      if(act.key==='forge') glx.flash.style.opacity=(sc.flash*.85).toFixed(3);
    }else glx.canvas.style.visibility='hidden';
  }
  const rr=run.getBoundingClientRect(), rspan=rr.height-vh;
  const rawRun=reduce?0:(rspan>0?clamp(-rr.top/rspan):0);
  runPs=reduce?0:runPs+(rawRun-runPs)*(1-Math.exp(-dt*8));
  if(reduce){for(let i=0;i<3;i++) panelFx(i,0);}
  else{
    track.style.transform='translate3d('+(-runPs*2*vw).toFixed(1)+'px,0,0)';
    for(let i=0;i<3;i++) panelFx(i,runPs*2-i);
    const o=runPs*500;
    for(let i=0;i<dashEls.length;i++) dashEls[i].setAttribute('stroke-dashoffset',(parseFloat(dashEls[i].dataset.o)+o).toFixed(1));
  }
  updateMeter();
}

/* 7 · WebGL boot (after the display font is ready so voxel type samples the real letters) */
async function initGL(){
  if(!window.THREE) throw new Error('three missing');
  try{await Promise.race([document.fonts.load('400 120px Anton'),new Promise(function(r){setTimeout(r,2500);})]);}catch(e){}
  const canvas=$('#gl');
  let renderer;
  try{ renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,powerPreference:'high-performance'}); }
  catch(e){ console.warn('Sharpening Iron: WebGL init failed.',e); throw e; }
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  const g={canvas:canvas,renderer:renderer,flash:$('#flash'),portrait:innerWidth/innerHeight<.85,
    scenes:{summit:makeSummit(),climb:makeClimb(),forge:null}};
  g.scenes.forge=makeForge(g.portrait);
  g.resize=function(w,h){
    renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
    renderer.setSize(w,h,false);
    const po=w/h<.85;
    if(po!==g.portrait){g.portrait=po; g.scenes.forge=makeForge(po);}
    Object.keys(g.scenes).forEach(function(k){g.scenes[k].resize(w,h);});
  };
  g.resize(innerWidth,innerHeight);
  return g;
}

let resizeTimer;
function onResize(){
  vw=innerWidth; vh=innerHeight;
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(function(){
    if(glx) glx.resize(vw,vh);
    buildRopes();
    if(reduce) frame(0);
  },120);
}
addEventListener('resize',onResize);
addEventListener('load',onResize);
onResize();

let started=false;
function start(){
  if(started) return; started=true;
  const loader=$('#loader');
  if(loader) loader.style.display='none';
  if(reduce){addEventListener('scroll',function(){frame(0);},{passive:true}); frame(0);}
  else{(function loop(n){frame(n); requestAnimationFrame(loop);})(performance.now());}
}
initGL().then(function(g){glx=g; onResize(); start();}).catch(function(){
  document.documentElement.classList.add('nogl'); glx=null; start();
});

/* 8 · Intro: one orchestrated moment on the masthead */
if(hasGsap&&!reduce){
  const tl=gsap.timeline({defaults:{ease:'power4.out'}});
  tl.fromTo('.title .ch',{yPercent:115,rotateX:-90,transformOrigin:'50% 100%'},{yPercent:0,rotateX:0,duration:1.05,stagger:.05})
    .fromTo('#slotsvg',{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0% 0 0)',duration:1.1,ease:'power3.inOut'},'-=.8')
    .fromTo('.bar',{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0% 0 0)',duration:.7,ease:'power3.inOut'},'-=.7')
    .fromTo('.stamp-mast',{scale:2.8,autoAlpha:0,rotation:-26},{scale:1,autoAlpha:1,rotation:-7,duration:.3,ease:'power4.in'},'-=.15')
    .fromTo('.stamp-mast',{x:-5},{x:0,duration:.5,ease:'elastic.out(2,.3)'});
}

/* 9 · Microinteractions (06 stays silent: its own CSS kills transitions) */
const toastEl=$('#toast'); let tt;
function toast(msg){toastEl.textContent=msg; toastEl.classList.add('on'); clearTimeout(tt); tt=setTimeout(function(){toastEl.classList.remove('on');},1700);}
async function copyText(txt){
  try{await navigator.clipboard.writeText(txt); return true;}
  catch(e){
    try{
      const ta=document.createElement('textarea');
      ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0'; ta.style.left='-9999px';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      const ok=document.execCommand('copy');
      ta.remove();
      return ok;
    }
    catch(e2){return false;}
  }
}
$$('.tag').forEach(function(chip){
  chip.addEventListener('click',async function(){
    const ok=await copyText(chip.dataset.tag);
    toast(ok?'COPIED '+chip.dataset.tag:'COPY FAILED — SELECT + COPY '+chip.dataset.tag);
    if(hasGsap&&!reduce&&!chip.closest('.calm')) gsap.fromTo(chip,{scale:.9},{scale:1,duration:.5,ease:'elastic.out(1.4,.4)'});
  });
});
if(fine&&hasGsap&&!reduce){
  $$('.emo-cell').forEach(function(cell){
    const emo=$('.emo',cell);
    cell.addEventListener('pointerenter',function(){gsap.fromTo(emo,{scale:.86},{scale:1,duration:.7,ease:'elastic.out(1.2,.35)'});});
    cell.addEventListener('pointermove',function(e){
      const r=cell.getBoundingClientRect(), x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;
      gsap.to(emo,{rotationY:x*50,rotationX:-y*50,duration:.35,ease:'power3.out',overwrite:'auto'});
    });
    cell.addEventListener('pointerleave',function(){gsap.to(emo,{rotationX:0,rotationY:0,duration:.8,ease:'elastic.out(1,.4)'});});
  });
}
$('#toTop').addEventListener('click',function(){scrollTo({top:0,behavior:reduce?'auto':'smooth'});});

/* 10 · Footer: barcode + ticker-tape */
(function(){
  const svg=$('#barcode'); let x=0, seed=7, out='';
  const rnd=function(){seed=(seed*16807)%2147483647; return seed/2147483647;};
  while(x<300){const w=1+Math.floor(rnd()*4); if(rnd()>.38) out+='<rect x="'+x+'" y="0" width="'+w+'" height="64" fill="#0A0A0A"/>'; x+=w+1;}
  svg.setAttribute('viewBox','0 0 '+x+' 64'); svg.innerHTML=out;
  const unit='<span>See you at the next checkpoint — Mark</span><i>▲</i>', half=new Array(5).join(unit);
  $('#tick').innerHTML=half+half;
})();
})();
