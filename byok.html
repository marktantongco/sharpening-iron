<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sharpening Iron — BYOK Models</title>
<style>
:root{--y:#FFD400;--k:#0A0A0A;--p:#F2EEE3;--mono:'Space Mono',ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--k);color:var(--p);font-family:var(--mono);padding:24px;line-height:1.5}
header{max-width:980px;margin:0 auto 24px}
h1{font-size:clamp(1.4rem,4vw,3rem);letter-spacing:.02em;margin-bottom:8px}
p{max-width:70ch;opacity:.85;margin-bottom:16px}
.controls{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
input,select{background:var(--p);color:var(--k);border:2px solid var(--k);padding:8px 10px;font:inherit}
table{width:100%;max-width:980px;border-collapse:collapse;font-size:.85rem}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #333}
th{background:var(--y);color:var(--k);font-weight:700;position:sticky;top:0}
tr:hover td{background:#111}
.tag{display:inline-block;background:var(--p);color:var(--k);border:2px solid var(--k);padding:2px 8px;font-size:.75rem;margin:2px}
.meta{opacity:.7;font-size:.8rem}
a{color:var(--y)}
</style>
</head>
<body>
<header>
  <h1>BYOK Models</h1>
  <p>Free, self-replenishing text-generation API models for coding and chat. Plug your own key. No credit card required.</p>
  <div class="controls">
    <input id="q" placeholder="Search model, provider, or tag…" />
    <select id="filter">
      <option value="">All providers</option>
    </select>
    <select id="best">
      <option value="">All use cases</option>
      <option>Code</option><option>General</option><option>Reasoning</option><option>Agent</option><option>Vision</option><option>Fallback</option>
    </select>
  </div>
  <p class="meta" id="count"></p>
</header>
<table>
  <thead>
    <tr>
      <th>Model</th>
      <th>Provider</th>
      <th>Context</th>
      <th>Best For</th>
      <th>Latency</th>
      <th>Quota</th>
      <th>Verified</th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>
<script>
fetch('providers.json')
  .then(r=>r.json())
  .then(data=>{
    const providers = data.providers;
    const rows = document.getElementById('rows');
    const q = document.getElementById('q');
    const filter = document.getElementById('filter');
    const best = document.getElementById('best');
    const count = document.getElementById('count');
    // Populate provider filter
    providers.forEach(p=>{
      const o = document.createElement('option'); o.value=p.name; o.textContent=p.name; filter.appendChild(o);
    });
    function render(){
      const qq = q.value.trim().toLowerCase();
      const pf = filter.value;
      const bf = best.value;
      let total = 0;
      let html = '';
      providers.forEach(p=>{
        if(pf && p.name !== pf) return;
        p.models.forEach(m=>{
          if(bf && m.best_for !== bf) return;
          if(qq){
            const hay = (p.name+' '+m.id+' '+m.best_for+' '+p.quota).toLowerCase();
            if(!hay.includes(qq)) return;
          }
          total++;
          html += `<tr>
            <td><code>${m.id}</code></td>
            <td><a href="${p.url}" target="_blank">${p.name}</a></td>
            <td>${m.context}</td>
            <td><span class="tag">${m.best_for}</span></td>
            <td>~${m.latency_s}s</td>
            <td>${p.quota}</td>
            <td>${p.verified}</td>
          </tr>`;
        });
      });
      rows.innerHTML = html;
      count.textContent = total + ' model' + (total===1?'':'s') + ' shown';
    }
    q.addEventListener('input', render);
    filter.addEventListener('change', render);
    best.addEventListener('change', render);
    render();
  });
</script>
</body>
</html>
